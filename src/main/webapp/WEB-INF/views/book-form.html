<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{book.form.title}">Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom px-4">
    <a class="navbar-brand" th:href="@{/books}" th:text="#{app.title}">Library</a>
</nav>

<div class="container" style="max-width: 500px; margin-top: 40px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-4" th:text="#{book.form.title}">Book details</h4>

            <form method="post" th:action="@{/books/save}">
                <input type="hidden" name="bookId" th:value="${book.bookId}">

                <div class="mb-3">
                    <label class="form-label" th:text="#{book.form.title}">Title</label>
                    <input type="text" name="title" class="form-control"
                           th:value="${book.title}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{books.author}">Author</label>
                    <input type="number" name="authorId" class="form-control"
                           th:value="${book.authorId}" placeholder="Author id" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{books.year}">Year</label>
                    <input type="number" name="publishYear" class="form-control"
                           th:value="${book.publishYear}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"
                              th:text="${book.description}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" th:text="#{book.form.save}">Save</button>
                <a th:href="@{/books}" class="btn btn-secondary" th:text="#{book.form.cancel}">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
