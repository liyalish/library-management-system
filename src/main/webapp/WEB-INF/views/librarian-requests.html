<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white border-bottom px-4">
    <a class="navbar-brand" th:href="@{/books}" th:text="#{app.title}">Library</a>
    <div class="ms-auto d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/books}">Catalog</a>
        <a class="btn btn-sm btn-outline-danger" th:href="@{/logout}" th:text="#{nav.logout}">Log out</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">Book requests</h3>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-hover bg-white align-middle">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Reader</th>
            <th>Book</th>
            <th>Type</th>
            <th>Status</th>
            <th>Return date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${requests.isEmpty()}">
            <td colspan="7" class="text-center text-muted">No requests</td>
        </tr>
        <tr th:each="r : ${requests}">
            <td th:text="${r.requestId}">1</td>
            <td th:text="${r.readerName}">Reader</td>
            <td th:text="${r.bookTitle}">Book</td>
            <td th:text="${r.requestType}">HOME</td>
            <td>
                <span class="badge"
                      th:classappend="${r.status == 'PENDING'} ? 'bg-warning text-dark'
                                    : (${r.status == 'ISSUED'} ? 'bg-primary'
                                    : (${r.status == 'RETURNED'} ? 'bg-success' : 'bg-secondary'))"
                      th:text="${r.status}">PENDING</span>
            </td>
            <td th:text="${r.returnDate}">-</td>
            <td>
                <!-- Issue: only for pending requests -->
                <form th:if="${r.status == 'PENDING'}" method="post"
                      th:action="@{'/librarian/requests/' + ${r.requestId} + '/issue'}"
                      class="d-flex gap-1">
                    <input type="date" name="returnDate" class="form-control form-control-sm"
                           style="width:auto;" required>
                    <button class="btn btn-sm btn-primary" type="submit">Issue</button>
                </form>
                <!-- Return: only for issued requests -->
                <form th:if="${r.status == 'ISSUED'}" method="post"
                      th:action="@{'/librarian/requests/' + ${r.requestId} + '/return'}">
                    <button class="btn btn-sm btn-success" type="submit">Mark returned</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
