<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{requests.my}">My requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white border-bottom px-4">
    <a class="navbar-brand" th:href="@{/books}" th:text="#{app.title}">Library</a>
    <div class="ms-auto d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/books}" th:text="#{nav.catalog}">Catalog</a>
        <a class="btn btn-sm btn-outline-danger" th:href="@{/logout}" th:text="#{nav.logout}">Log out</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3" th:text="#{requests.my}">My requests</h3>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-hover bg-white">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th th:text="#{requests.book}">Book</th>
            <th th:text="#{requests.type}">Type</th>
            <th th:text="#{requests.status}">Status</th>
            <th th:text="#{requests.returnDeadline}">Return deadline</th>
            <th th:text="#{requests.action}">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${requests.isEmpty()}">
            <td colspan="6" class="text-center text-muted" th:text="#{requests.my.empty}">
                You have no requests yet
            </td>
        </tr>

        <tr th:each="r : ${requests}">
            <td th:text="${r.requestId}">1</td>
            <td th:text="${r.bookTitle}">Book</td>

            <td>
                <span th:if="${r.requestType == 'HOME'}" th:text="#{request.type.HOME}">HOME</span>
                <span th:if="${r.requestType == 'READING_ROOM'}" th:text="#{request.type.READING_ROOM}">READING_ROOM</span>
            </td>

            <td>
                <span th:if="${r.overdue}" class="badge bg-danger" th:text="#{status.OVERDUE}">
                    OVERDUE
                </span>

                <span th:if="${!r.overdue and r.status == 'PENDING'}"
                      class="badge bg-warning text-dark" th:text="#{status.PENDING}">
                    PENDING
                </span>

                <span th:if="${!r.overdue and r.status == 'ISSUED'}"
                      class="badge bg-primary" th:text="#{status.ISSUED}">
                    ISSUED
                </span>

                <span th:if="${!r.overdue and r.status == 'PENDING_RETURN'}"
                      class="badge bg-info text-dark" th:text="#{status.PENDING_RETURN}">
                    PENDING_RETURN
                </span>

                <span th:if="${!r.overdue and r.status == 'RETURNED'}"
                      class="badge bg-success" th:text="#{status.RETURNED}">
                    RETURNED
                </span>

                <span th:if="${!r.overdue and r.status == 'CANCELLED'}"
                      class="badge bg-secondary" th:text="#{status.CANCELLED}">
                    CANCELLED
                </span>
            </td>

            <td th:text="${r.returnDate != null ? r.returnDate : '-'}">-</td>

            <td>
                <form th:if="${r.status == 'PENDING'}" method="post"
                      th:action="@{'/requests/' + ${r.requestId} + '/cancel'}"
                      onsubmit="return confirm('Cancel this request?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit"
                            th:text="#{requests.cancel}">
                        Cancel
                    </button>
                </form>

                <form th:if="${r.status == 'ISSUED'}" method="post"
                      th:action="@{'/requests/' + ${r.requestId} + '/return'}"
                      onsubmit="return confirm('Return this book?');">
                    <button class="btn btn-sm btn-success" type="submit"
                            th:text="#{requests.return}">
                        Return
                    </button>
                </form>

                <span th:if="${r.status == 'PENDING_RETURN'}" class="text-muted small"
                      th:text="#{requests.waitingLibrarian}">
                    Waiting librarian approval
                </span>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-4 border-top pt-3">
        <form method="post" th:action="@{/account/delete}"
              onsubmit="return confirm('Delete your account? You can do this only if you have no active requests.');">
            <button class="btn btn-outline-danger btn-sm" type="submit"
                    th:text="#{account.delete}">
                Delete my account
            </button>
        </form>
    </div>
</div>
</body>
</html>
