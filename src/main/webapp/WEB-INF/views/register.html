<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom px-4">
    <span class="navbar-brand" th:text="#{app.title}">Library</span>

    <div class="ms-auto">
        <a class="btn btn-sm btn-outline-secondary" href="?lang=en">EN</a>
        <a class="btn btn-sm btn-outline-secondary" href="?lang=ru">RU</a>
    </div>
</nav>

<div class="container" style="max-width: 420px; margin-top: 50px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-4" th:text="#{register.title}">Register</h4>

            <div class="alert alert-danger" th:if="${registerError}" th:text="${registerError}">
                Error
            </div>

            <form method="post" th:action="@{/register}" th:object="${registrationForm}" autocomplete="off">
                <!-- Fake fields to prevent browser autofill -->
                <input type="text" name="fakeUsername" autocomplete="username"
                       style="position:absolute; left:-9999px; opacity:0;">
                <input type="password" name="fakePassword" autocomplete="current-password"
                       style="position:absolute; left:-9999px; opacity:0;">

                <div class="mb-3">
                    <label class="form-label" th:text="#{login.username}">Username</label>
                    <input type="text"
                           th:field="*{username}"
                           class="form-control"
                           autocomplete="new-username"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           required
                           minlength="3">

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}">
                        Username error
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{register.fullname}">Full name</label>
                    <input type="text"
                           th:field="*{fullName}"
                           class="form-control"
                           autocomplete="off"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           required>

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                        Full name error
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{register.email}">Email</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           autocomplete="new-email"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           required>

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                        Email error
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{login.password}">Password</label>
                    <input type="password"
                           th:field="*{password}"
                           class="form-control"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           required
                           minlength="4">

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                        Password error
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100" th:text="#{register.submit}">
                    Create account
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" th:text="#{nav.login}">Log in</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
