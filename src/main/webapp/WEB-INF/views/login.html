<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom px-4">
    <span class="navbar-brand" th:text="#{app.title}">Library</span>
    <div class="ms-auto">
        <a class="btn btn-sm btn-outline-secondary" href="?lang=en">EN</a>
        <a class="btn btn-sm btn-outline-secondary" href="?lang=ru">RU</a>
    </div>
</nav>

<div class="container" style="max-width: 400px; margin-top: 60px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-4" th:text="#{login.title}">Log in</h4>

            <div class="alert alert-danger" th:if="${loginError}" th:text="#{login.error}">
                Invalid username or password
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label" th:text="#{login.username}">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{login.password}">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Log in</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/register}" th:text="#{nav.register}">Register</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
