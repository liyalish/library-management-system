<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{books.title}">Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white border-bottom px-4">
    <a class="navbar-brand" th:href="@{/books}" th:text="#{app.title}">Library</a>

    <div class="ms-auto d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-secondary" href="?lang=en" th:text="#{nav.language.en}">EN</a>
        <a class="btn btn-sm btn-outline-secondary" href="?lang=ru" th:text="#{nav.language.ru}">RU</a>

        <a th:if="${session.currentUser != null and session.currentUser.role.name() == 'READER'}"
           class="btn btn-sm btn-outline-primary"
           th:href="@{/requests}"
           th:text="#{requests.my}">My requests</a>

        <a th:if="${session.currentUser != null and session.currentUser.role.name() == 'LIBRARIAN'}"
           class="btn btn-sm btn-outline-primary"
           th:href="@{/librarian/requests}"
           th:text="#{nav.requests}">Requests</a>

        <a th:if="${session.currentUser != null and session.currentUser.role.name() == 'ADMIN'}"
           class="btn btn-sm btn-outline-primary"
           th:href="@{/admin/requests}"
           th:text="#{nav.requests}">Requests</a>

        <a th:if="${session.currentUser != null and session.currentUser.role.name() == 'ADMIN'}"
           class="btn btn-sm btn-outline-primary"
           th:href="@{/admin/users}"
           th:text="#{nav.users}">Users</a>

        <span th:if="${session.currentUser != null}"
              th:text="${session.currentUser.fullName}" class="text-muted small"></span>

        <a th:if="${session.currentUser != null}" class="btn btn-sm btn-outline-danger"
           th:href="@{/logout}" th:text="#{nav.logout}">Log out</a>

        <a th:if="${session.currentUser == null}" class="btn btn-sm btn-primary"
           th:href="@{/login}" th:text="#{nav.login}">Log in</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="#{books.title}">Book catalog</h3>

        <a th:if="${session.currentUser != null and session.currentUser.role.name() == 'LIBRARIAN'}"
           class="btn btn-success" th:href="@{/books/new}" th:text="#{books.add}">Add book</a>
    </div>

    <form method="get" th:action="@{/books}" class="card card-body mb-4">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" name="search" class="form-control"
                       th:value="${search}" th:placeholder="#{books.search}">
            </div>

            <div class="col-md-3">
                <select name="authorId" class="form-select">
                    <option value="" th:text="#{books.authors.all}">All authors</option>
                    <option th:each="a : ${authors}"
                            th:value="${a.authorId}"
                            th:text="${a.fullName}"
                            th:selected="${selectedAuthorId != null and selectedAuthorId == a.authorId}">
                        Author
                    </option>
                </select>
            </div>

            <div class="col-md-3">
                <select name="genreId" class="form-select">
                    <option value="" th:text="#{books.genres.all}">All genres</option>
                    <option th:each="g : ${genres}"
                            th:value="${g.genreId}"
                            th:text="${g.name}"
                            th:selected="${selectedGenreId != null and selectedGenreId == g.genreId}">
                        Genre
                    </option>
                </select>
            </div>

            <div class="col-md-2 d-grid">
                <button class="btn btn-primary" type="submit" th:text="#{books.filter}">Filter</button>
            </div>
        </div>

        <div class="mt-2">
            <a th:href="@{/books}" class="small text-muted" th:text="#{books.reset}">Reset filters</a>
        </div>
    </form>

    <div th:if="${books.isEmpty()}" class="alert alert-light border text-center text-muted"
         th:text="#{books.empty}">
        No books found
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="b : ${books}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${b.title}">Book title</h5>

                    <p class="text-muted mb-1">
                        <span th:text="${b.authorName}">Author</span>
                        <span th:if="${b.publishYear != null}">
                            · <span th:text="${b.publishYear}">Year</span>
                        </span>
                    </p>

                    <p class="small text-muted mb-2" th:if="${b.genreNames != null and !b.genreNames.isBlank()}">
                        <span th:text="#{books.genres}">Genres</span>:
                        <span th:text="${b.genreNames}">Genres</span>
                    </p>

                    <p class="card-text mt-2" th:text="${b.description}">
                        Book description
                    </p>

                    <div class="mb-3">
                        <span th:if="${b.availableCopies > 0}" class="badge bg-success">
                            <span th:text="#{books.available}">Available</span>:
                            <span th:text="${b.availableCopies}">5</span>
                        </span>

                        <span th:if="${b.availableCopies == 0}" class="badge bg-danger"
                              th:text="#{books.noCopies}">
                            No copies available
                        </span>
                    </div>

                    <div class="mt-auto">
                        <form th:if="${session.currentUser != null and session.currentUser.role.name() == 'READER'}"
                              method="post" th:action="@{/requests/create}">
                            <input type="hidden" name="bookId" th:value="${b.bookId}">

                            <div class="d-flex gap-2">
                                <select name="requestType" class="form-select form-select-sm"
                                        th:disabled="${b.availableCopies == 0}">
                                    <option value="HOME" th:text="#{books.requestType.home}">Home</option>
                                    <option value="READING_ROOM" th:text="#{books.requestType.readingRoom}">Reading room</option>
                                </select>

                                <button class="btn btn-sm btn-success" type="submit"
                                        th:disabled="${b.availableCopies == 0}"
                                        th:text="#{books.request}">
                                    Request
                                </button>
                            </div>
                        </form>

                        <div th:if="${session.currentUser != null and session.currentUser.role.name() == 'LIBRARIAN'}"
                             class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{'/books/' + ${b.bookId} + '/edit'}"
                               th:text="#{books.edit}">Edit</a>

                            <form method="post" th:action="@{'/books/' + ${b.bookId} + '/delete'}"
                                  onsubmit="return confirm('Delete this book?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit"
                                        th:text="#{books.delete}">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination">
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/books(page=${i}, search=${search}, authorId=${selectedAuthorId}, genreId=${selectedGenreId})}"
                   th:text="${i}">1</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
